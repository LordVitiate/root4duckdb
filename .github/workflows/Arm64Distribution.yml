name: ROOT4DuckDB Linux ARM64

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux_arm64:
    name: linux_arm64
    runs-on: ubuntu-24.04-arm
    env:
      CI_PLATFORM: linux
      DUCKDB_PLATFORM: linux_arm64
      CI_MATRIX_RUNNER: ubuntu-24.04-arm
      CI_EXTENSION_NAME: root
      DUCKDB_VERSION: v2.0.0
      DUCKDB_COMMIT: d54cbbe3df17e8e5ce68312f483b4155836112aa
      CI_BUILD_TYPE: release
      CI_BUILD_DUCKDB_SHELL: 'true'
      CI_VCPKG_URL: https://github.com/microsoft/vcpkg.git
      CI_VCPKG_COMMIT: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3
      CI_VCPKG_OVERLAY_PORTS: extension-ci-tools/vcpkg_ports
      CI_VCPKG_OVERLAY_TRIPLETS: extension-ci-tools/toolchains
      VCPKG_TARGET_TRIPLET: arm64-linux-release
      VCPKG_HOST_TRIPLET: arm64-linux-release
      VCPKG_BINARY_SOURCES: clear;http,https://vcpkg-cache.duckdb.org,read
      CI_USE_DEFAULT_RUNNERS: 'true'
      CI_RUN_DISK_CLEAN_STEP: 'true'
      CI_TEST_CONFIG: '{"test_env_variables":{"ROOT4DUCKDB_ROOT_CONFIG":"/duckdb_build_dir/.deps/community-root/bin/root-config","LD_LIBRARY_PATH":"/duckdb_build_dir/.deps/community-root/lib"}}'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: duckdb/extension-ci-tools
          ref: v2.0-cyanoptera
          path: extension-ci-tools
      - name: Prepare DuckDB sources
        run: python3 extension-ci-tools/scripts/ci_phase.py checkout
      - name: Configure build
        run: python3 extension-ci-tools/scripts/ci_phase.py setup
      - name: Fix AlmaLinux 8 repositories in ARM64 image
        run: |
          cp .github/scripts/fix-arm64-repos.py extension-ci-tools/docker/linux_arm64/
          python3 - <<'PY'
          from pathlib import Path
          path = Path("extension-ci-tools/docker/linux_arm64/Dockerfile")
          content = path.read_text()
          marker = 'RUN yum groupinstall -y "Development Tools"'
          assert content.count(marker) == 1
          fixed = 'COPY fix-arm64-repos.py /tmp/fix-arm64-repos.py\nRUN python3 /tmp/fix-arm64-repos.py && yum clean all && yum groupinstall -y "Development Tools"'
          path.write_text(content.replace(marker, fixed, 1))
          PY
      - name: Build
        run: python3 extension-ci-tools/scripts/ci_phase.py build
      - name: Test
        run: python3 extension-ci-tools/scripts/ci_phase.py test
      - name: Prepare extension artifact
        id: artifacts
        run: python3 extension-ci-tools/scripts/ci_phase.py upload
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: ${{ steps.artifacts.outputs.artifact_name }}
          path: ${{ steps.artifacts.outputs.artifact_path }}
