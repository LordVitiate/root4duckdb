name: DuckDB Community Extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: root4duckdb-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  dependency_preflight:
    name: ELF dependency regression
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u scripts/test-normalize-root-needed.py

  linux:
    needs: dependency_preflight
    uses: ./.github/workflows/LinuxDistribution.yml

  publish:
    name: Publish successful release artifacts
    needs: linux
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: root-v2.0.0-extension-*
          path: ${{ runner.temp }}/root4duckdb-artifacts
      - name: Publish tested binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          ARTIFACT_DIR: ${{ runner.temp }}/root4duckdb-artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/root4duckdb-release"
          count=0
          while IFS= read -r -d '' file; do
            artifact=$(basename "$(dirname "$file")")
            arch=${artifact#root-v2.0.0-extension-}
            [[ "$arch" != "$artifact" ]] || exit 1
            cp "$file" "${RUNNER_TEMP}/root4duckdb-release/root4duckdb-${TAG}-duckdb-v2.0.0-${arch}-root-6.40.04.duckdb_extension"
            count=$((count+1))
          done < <(find "$ARTIFACT_DIR" -type f -name root.duckdb_extension -print0)
          ((count > 0)) || { echo "[ERROR] No tested extensions available for release" >&2; exit 1; }
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --title "ROOT4DuckDB $TAG" --generate-notes
          gh release upload "$TAG" "${RUNNER_TEMP}"/root4duckdb-release/*.duckdb_extension --clobber
